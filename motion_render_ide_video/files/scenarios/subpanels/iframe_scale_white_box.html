<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Iframe scale white-box test</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#d7263d; }
    .white-box {
      box-sizing:border-box;
      width:100%;
      height:100%;
      background:#fff;
      border:12px solid #1463ff;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#121826;
      font:700 30px/1.2 Arial,sans-serif;
    }
  </style>
</head>
<body>
  <div class="white-box">100% white box</div>
</body>
</html>
